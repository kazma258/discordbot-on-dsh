# Defaults are intentionally empty: fill them from Settings -> Discord Bot.
# The plugin refuses to connect Discord until guildIds and channelIds exist.
- insert:
    - id: discord-bot
      name: '@local/dsh-discord-bot'
      config:
        guildIds: []
        channelIds: []
        ownerUserId: ''
        preset: discord-whale
        provider: ''
        model: ''
        reasoningEffort: ''
        replyTimeoutMs: 120000
        logLevel: info
